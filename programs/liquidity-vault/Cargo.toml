[package]
name = "liquidity-vault"
version = "0.1.0"
description = "Учебный Liquidity Vault на Solana (Anchor)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "liquidity_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# cfg-фичи, на которые ссылаются макросы Anchor (#[program], #[derive(Accounts)]).
# Объявлены, чтобы не было предупреждений unexpected_cfgs.
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = "1.2.2"
